license = "MIT"
description = "Transport primitives for EstroDesk"

[dependencies]
estrodesk-protocol = { path = "../protocol" }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "net", "rt", "macros"] }
