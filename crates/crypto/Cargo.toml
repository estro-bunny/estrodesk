[package]
name = "estrodesk-crypto"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Cryptographic identity primitives for EstroDesk"

[dependencies]
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hkdf = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
thiserror = "2"
x25519-dalek = { version = "2", features = ["static_secrets", "getrandom"] }
